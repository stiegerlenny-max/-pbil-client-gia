name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Projektordner finden
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          echo "gefunden: $G"
          echo "DIR=$(dirname "$G")" >> "$GITHUB_ENV"
      - name: Bauen
        run: |
          cd "$DIR"
          test -f build.gradle || cp build.gradle.txt build.gradle
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: pbil-client
          path: '**/build/libs/*.jar'
